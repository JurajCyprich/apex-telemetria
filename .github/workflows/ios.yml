# Postaví appku pre iPhone (ApexVolant.ipa) na macOS v GitHub cloude – nepodpísanú.
# Podpíše ju až Sideloadly / AltStore s Apple ID používateľa pri inštalácii.
name: iPhone appka

on:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: XcodeGen
        run: brew install xcodegen

      - name: Xcode projekt
        working-directory: ios
        run: xcodegen generate

      - name: Build
        working-directory: ios
        run: |
          xcodebuild -version
          xcodebuild -project ApexVolant.xcodeproj -target ApexVolant -configuration Release \
            -sdk iphoneos SYMROOT="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build

      - name: IPA
        working-directory: ios
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/ApexVolant.app Payload/
          zip -qry ApexVolant.ipa Payload
          ls -la ApexVolant.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: ApexVolant-ipa
          path: ios/ApexVolant.ipa
          if-no-files-found: error
